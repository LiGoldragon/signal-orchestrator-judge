[package]
name         = "signal-orchestrator-judge"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-orchestrator-judge"
description  = "Typed orchestrator judge request and reply Signal contract: topic assignment and message triage."
publish      = false
include      = ["Cargo.toml", "Cargo.lock", "README.md", "schema/**", "src/**", "tests/**"]

[lib]
name = "signal_orchestrator_judge"
path = "src/lib.rs"

[features]
default = []
nota-text = [
  "dep:nota",
  "signal-frame/nota-text",
  "signal-orchestrate/nota-text",
  "signal-orchestrator-message/nota-text",
]

[dependencies]
nota                        = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main", optional = true }
rkyv                        = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame                = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main", default-features = false }
signal-orchestrate          = { path = "../signal-orchestrate", default-features = false }
signal-orchestrator-message = { path = "../signal-orchestrator-message", default-features = false }
thiserror                   = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
